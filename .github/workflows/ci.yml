name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP lint(全部 PHP 文件)
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" || fail=1
          done < <(git ls-files '*.php')
          exit $fail
      - name: JS 语法检查(排除 vendor)
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in vendor/*) continue;; esac
            node --check "$f" || fail=1
          done < <(git ls-files '*.js')
          exit $fail
      - name: 图标匹配自检(规则目标文件必须存在 + 关键模型命中)
        run: node tests/logos-check.js
      - name: 演示管理员还原自检(拍摄/到期还原/反复还原)
        run: php tests/demo-revert.php
      - name: 生图响应解析自检(各平台返回形态)
        run: php tests/image-parse.php
      - name: 上游地址拼接自检(补 /v1 / 不重复)
        run: php tests/upstream-url.php

  e2e:
    name: E2E(PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: 运行 E2E 套件
        run: bash tests/e2e.sh
